name: cloudopsagent

services:
  app:
    build:
      context: ./services/app
    image: cloudopsagent/app:local
    env_file:
      - path: .env
        required: false
    environment:
      APP_SERVICE_PORT: ${APP_SERVICE_PORT:-8001}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      APP_SIMULATION_ENABLED: ${APP_SIMULATION_ENABLED:-true}
      APP_SIMULATION_MAX_DURATION_SECONDS: ${APP_SIMULATION_MAX_DURATION_SECONDS:-300}
      APP_SIMULATION_DEFAULT_DURATION_SECONDS: ${APP_SIMULATION_DEFAULT_DURATION_SECONDS:-30}
      APP_MAX_LOG_ENTRIES: ${APP_MAX_LOG_ENTRIES:-500}
      APP_BASELINE_REPLICAS: ${APP_BASELINE_REPLICAS:-2}
      APP_MIN_REPLICAS: ${APP_MIN_REPLICAS:-1}
      APP_MAX_REPLICAS: ${APP_MAX_REPLICAS:-10}
    ports:
      - "${APP_SERVICE_PORT:-8001}:8001"
    networks:
      - cloudops
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  agent:
    build:
      context: ./services/agent
    image: cloudopsagent/agent:local
    env_file:
      - path: .env
        required: false
    environment:
      AGENT_SERVICE_PORT: ${AGENT_SERVICE_PORT:-8000}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-INFO}
      AGENT_APP_BASE_URL: ${AGENT_APP_BASE_URL:-http://app:8001}
      AGENT_POLL_INTERVAL_SECONDS: ${AGENT_POLL_INTERVAL_SECONDS:-10}
      AGENT_MONITORING_ENABLED: ${AGENT_MONITORING_ENABLED:-true}
      AGENT_TRAFFIC_SPIKE_RPS_THRESHOLD: ${AGENT_TRAFFIC_SPIKE_RPS_THRESHOLD:-20.0}
      AGENT_APP_REQUEST_TIMEOUT_SECONDS: ${AGENT_APP_REQUEST_TIMEOUT_SECONDS:-5.0}
      AGENT_APPROVAL_TIMEOUT_SECONDS: ${AGENT_APPROVAL_TIMEOUT_SECONDS:-300}
      AGENT_BASELINE_REPLICAS: ${AGENT_BASELINE_REPLICAS:-2}
      AGENT_HEALTHY_CPU_THRESHOLD: ${AGENT_HEALTHY_CPU_THRESHOLD:-70.0}
      AGENT_HEALTHY_LATENCY_MS_THRESHOLD: ${AGENT_HEALTHY_LATENCY_MS_THRESHOLD:-150.0}
    ports:
      - "${AGENT_SERVICE_PORT:-8000}:8000"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - cloudops
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ./services/dashboard
    image: cloudopsagent/dashboard:local
    # nginx listens on 3000 inside the container; DASHBOARD_PORT moves the
    # published host port only, so nothing inside needs to read it.
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      agent:
        # nginx resolves the upstreams per request through Docker's DNS, so it
        # only needs the service to exist; it does not need the agent healthy to
        # serve the shell or the app proxy.
        condition: service_started
    networks:
      - cloudops
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 first and
      # nginx binds IPv4 only, which reads as "connection refused".
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  cloudops:
    driver: bridge
