[project]
name = "cloudops-app"
version = "0.1.0"
description = "Simulated Python application target for the CloudOpsAgent incident-response platform."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_app"]
