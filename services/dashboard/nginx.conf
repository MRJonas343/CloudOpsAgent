# nginx front door for the dashboard (ADR-006).
#
# One origin, two jobs: serve the built SPA, and reverse-proxy `/api/agent` and
# `/api/app` onto the backends so the browser never crosses an origin and no
# service needs CORS configuration.
#
# The upstreams are reached through Docker's embedded DNS via a variable rather
# than a literal `proxy_pass http://agent:8000`. A literal name is resolved once
# at startup and cached forever, so `docker compose restart agent` would leave
# nginx pinning a dead IP; resolving per request keeps a restart invisible.
#
# Order matters in these blocks: `set` must come before `rewrite ... break`,
# because `break` ends the rewrite phase and any `set` after it never runs.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # -- agent: incidents, reports, decisions, and the event stream -------------

    # `/api/agent/events` is matched by the exact location below, which wins over
    # this prefix match.
    location /api/agent/ {
        set $agent_upstream http://agent:8000;
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass $agent_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The event stream must reach the browser frame by frame. With buffering on,
    # nginx would hold the response until the connection closed and the live list
    # would silently become a load-once list.
    location = /api/agent/events {
        set $agent_upstream http://agent:8000;
        rewrite ^/api/agent/(.*)$ /$1 break;
        proxy_pass $agent_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;

        # The agent already sends this; re-asserting it keeps the stream
        # unbuffered for any proxy that might sit in front of nginx.
        add_header X-Accel-Buffering no always;
    }

    # -- app: read-only observability, and the simulation controls -------------

    location /api/app/ {
        set $app_upstream http://app:8001;
        rewrite ^/api/app/(.*)$ /$1 break;
        proxy_pass $app_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -- the SPA: client-side routes fall back to index.html -------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}
